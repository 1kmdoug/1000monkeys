<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f4ecd8" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#16140f" media="(prefers-color-scheme: dark)" />
<meta name="description" content="1000 Monkeys: read your draft like a finished book, mark it up as you go, and send your notes back to where you write." />
<meta name="robots" content="noindex, nofollow" />
<title>1000 Monkeys</title>
<!--
  Placeholder landing page (issue #15). The reader lives at /app/.
  Links into the app are relative ("app/") so the site works under any path.
-->
<style>
  :root {
    --bg: #f4ecd8;
    --bg-2: #ead9b8;
    --ink: #4a3a26;
    --ink-soft: #7a6747;
    --rule: #d3c198;
    --accent: #7a3017;
    --serif: "Charter", "Iowan Old Style", "Sitka Text", "Sitka", "Cambria", Georgia, "Times New Roman", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16140f;
      --bg-2: #1f1c16;
      --ink: #d8d2c4;
      --ink-soft: #8e8676;
      --rule: #322c20;
      --accent: #c98a6b;
    }
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--serif);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  body {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  a { color: inherit; }

  .wrap {
    width: 100%;
    max-width: 38rem;
    margin: 0 auto;
    padding: 0 1.5rem;
  }

  header .wrap {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 1px solid var(--rule);
    padding-top: 1.75rem;
    padding-bottom: 1rem;
  }
  .wordmark {
    margin: 0;
    font-size: 1.05rem;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
  }
  .login {
    font-size: 0.85rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-decoration: none;
    color: var(--ink-soft);
    padding: 0.4rem 0;
  }
  .login:hover, .login:focus-visible { color: var(--accent); }

  main { flex: 1; display: flex; align-items: center; }
  .hero { padding-top: 4rem; padding-bottom: 4rem; }
  .hero h2 {
    font-size: clamp(2rem, 7vw, 2.8rem);
    line-height: 1.12;
    font-weight: 600;
    margin: 0 0 1.25rem;
    letter-spacing: -0.01em;
  }
  .hero p {
    font-size: 1.125rem;
    line-height: 1.72;
    margin: 0 0 1rem;
  }
  .hero .soft { color: var(--ink-soft); font-style: italic; font-size: 1rem; }

  .cta {
    display: inline-block;
    margin-top: 1.5rem;
    padding: 0.85rem 1.6rem;
    background: var(--ink);
    color: var(--bg);
    text-decoration: none;
    font-size: 1rem;
    letter-spacing: 0.05em;
    border: 1px solid var(--ink);
    transition: transform .12s ease, background .15s ease;
  }
  .cta:hover { background: var(--accent); border-color: var(--accent); }
  .cta:active { transform: translateY(1px); }
  .cta:focus-visible, .login:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .endmark {
    text-align: center;
    color: var(--ink-soft);
    margin: 3rem 0 0;
    font-size: 1.2rem;
  }

  footer .wrap {
    border-top: 1px solid var(--rule);
    padding-top: 1rem;
    padding-bottom: 1.5rem;
    font-size: 0.78rem;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    font-style: italic;
  }

  @media (prefers-reduced-motion: reduce) {
    .cta { transition: none; }
  }
</style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1 class="wordmark">1000 Monkeys</h1>
      <a class="login" href="app/#login" id="loginLink">Log in</a>
    </div>
  </header>

  <main>
    <div class="wrap hero">
      <h2>Read your draft like a finished book.</h2>
      <p>Mark it up as you go, and your notes find their way back to where you write.</p>
      <p class="soft">Given enough monkeys, the story gets written.</p>
      <a class="cta" href="app/" id="openReader">Open the reader</a>
      <div class="endmark" aria-hidden="true">❦</div>
    </div>
  </main>

  <footer>
    <div class="wrap">1000 Monkeys Publishing Co. · coming soon</div>
  </footer>
</body>
</html>
